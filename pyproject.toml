[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quaph"
version = "0.1.0"
description = "A library facilitating the generation of phase diagrams of quantum simulations of fermionic Hamiltonians."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Adam Godel", email = "adam.g@thewiser.org" },
    { name = "Adrian Acosta", email = "adrian.a@thewiser.org" },
    { name = "Maggie Bao", email = "maggie.b@thewiser.org" },
]
keywords = ["quantum", "qiskit", "majorana", "topological", "vqe", "iqpe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "h5py>=3",
    "joblib>=1.5",
    "loguru>=0.7",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "qiskit>=2.2",
    "qiskit-aer>=0.17",
    "qiskit-algorithms>=0.4",
    "qiskit-ibm-runtime>=0.43",
    "qiskit-nature>=0.7",
    "rich>=13",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "asteval>=1.0",
]

[project.scripts]
quaph = "quaph._cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quaph*"]

[tool.setuptools.package-data]
quaph = ["julia-dmrg/*.jl", "julia-dmrg/*.toml", "models/*.yaml", "models/*.yml"]
