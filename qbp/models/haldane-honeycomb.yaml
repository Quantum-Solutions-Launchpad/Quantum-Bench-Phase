name: haldane-honeycomb
display_name: "Haldane (honeycomb)"
spin: 1
n_dims: 2
lattice_shape: [Lx, Ly]
sites_per_cell: 2
sublattices: [A, B]
lattice_vectors: [[-0.86602540378443864676, -1.5], [0.86602540378443864676, -1.5]]
sublattice_positions:
  A: [0, 0]
  B: [0, -1]
parameters:
  t1: {label: "t_1"}
  t2: {label: "t_2"}
  phi: {label: "\\phi"}
  M:   {label: "M"}

terms:
  - kind: onsite
    sublattice: A
    coefficient: "+M"
  - kind: onsite
    sublattice: B
    coefficient: "-M"

  # NN A→B at offsets (0,0), (-1,0), (0,-1); add hermitian partner.
  - kind: hopping
    from: A
    to: B
    offsets: [[0, 0], [-1, 0], [0, -1]]
    coefficient: "-t1"
    hermitian_partner: true

  # NNN A→A with phase +phi at offsets (+1,0), (-1,+1), (0,-1).
  - kind: hopping
    from: A
    to: A
    offsets: [[1, 0], [-1, 1], [0, -1]]
    coefficient: "-t2 * exp(1j*phi)"
    hermitian_partner: true

  # NNN B→B at the reversed offsets (-1,0), (+1,-1), (0,+1) with the same
  # +phi coefficient, so a hop along a given vector sees -phi on B where it
  # sees +phi on A. This relative sign is the Haldane mass.
  - kind: hopping
    from: B
    to: B
    offsets: [[-1, 0], [1, -1], [0, 1]]
    coefficient: "-t2 * exp(1j*phi)"
    hermitian_partner: true

optimizer:
  type: SPSA
  kwargs:
    maxiter: "@max_iters"

mapper:
  type: JordanWignerMapper
  kwargs: {}

ansatz:
  type: excitation_preserving
  kwargs:
    mode: fsim
    entanglement: linear
    reps: "@n_layers"
  initial_state_prefix: hartree_fock
