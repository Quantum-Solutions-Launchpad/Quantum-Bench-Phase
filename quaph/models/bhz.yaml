name: bhz
display_name: Bernevig–Hughes–Zhang
spin: 1
n_dims: 2
lattice_shape: [Lx, Ly]
sites_per_cell: 2
sublattices: [s, p]
parameters:
  A: {label: "A"}
  B: {label: "B"}
  M: {label: "M"}

# Single (s, p) Wilson–Dirac block of the BHZ model on a square lattice:
#   d_x(k) = A sin(kx)
#   d_y(k) = A sin(ky)
#   d_z(k) = M − 2B (2 − cos kx − cos ky)
#          = (M − 4B) + 2B cos kx + 2B cos ky
# Phase boundaries (gap closing): M = 0, M = 4B, M = 8B (sign of B sets order).

terms:
  # (M − 4B) σz onsite
  - kind: onsite
    sublattice: s
    coefficient: "+(M - 4*B)"
  - kind: onsite
    sublattice: p
    coefficient: "-(M - 4*B)"

  # 2B cos kx σz: NN s→s and p→p along x with coef ±B
  - kind: hopping
    from: s
    to: s
    offsets: [[1, 0]]
    coefficient: "+B"
    hermitian_partner: true
  - kind: hopping
    from: p
    to: p
    offsets: [[1, 0]]
    coefficient: "-B"
    hermitian_partner: true
  # 2B cos ky σz
  - kind: hopping
    from: s
    to: s
    offsets: [[0, 1]]
    coefficient: "+B"
    hermitian_partner: true
  - kind: hopping
    from: p
    to: p
    offsets: [[0, 1]]
    coefficient: "-B"
    hermitian_partner: true

  # A sin kx σx
  - kind: hopping
    from: s
    to: p
    offsets: [[1, 0]]
    coefficient: "-1j*A/2"
    hermitian_partner: true
  - kind: hopping
    from: s
    to: p
    offsets: [[-1, 0]]
    coefficient: "+1j*A/2"
    hermitian_partner: true

  # A sin ky σy
  - kind: hopping
    from: s
    to: p
    offsets: [[0, 1]]
    coefficient: "-A/2"
    hermitian_partner: true
  - kind: hopping
    from: s
    to: p
    offsets: [[0, -1]]
    coefficient: "+A/2"
    hermitian_partner: true

optimizer:
  type: SPSA
  kwargs:
    maxiter: "@max_iters"

mapper:
  type: JordanWignerMapper
  kwargs: {}

ansatz:
  type: excitation_preserving
  kwargs:
    mode: fsim
    entanglement: linear
    reps: "@n_layers"
  initial_state_prefix: hartree_fock
