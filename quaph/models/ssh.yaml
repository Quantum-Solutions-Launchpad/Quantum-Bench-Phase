name: ssh
display_name: SSH
spin: 1
n_dims: 1
lattice_shape: [Lx]
sites_per_cell: 2
sublattices: [A, B]
parameters:
  t1: {label: "t_1"}
  t2: {label: "t_2"}

terms:
  # intra-cell bond (A↔B at offset 0)
  - kind: hopping
    from: A
    to: B
    offsets: [[0]]
    coefficient: "-t1"
    hermitian_partner: true

  # inter-cell bond (B in cell c → A in cell c+1)
  - kind: hopping
    from: B
    to: A
    offsets: [[1]]
    coefficient: "-t2"
    hermitian_partner: true

optimizer:
  type: SPSA
  kwargs:
    maxiter: "@max_iters"

mapper:
  type: JordanWignerMapper
  kwargs: {}

ansatz:
  type: excitation_preserving
  kwargs:
    mode: fsim
    entanglement: linear
    reps: "@n_layers"
  initial_state_prefix: hartree_fock
