name: extended-hubbard
display_name: Extended Hubbard
spin: 2
n_dims: 2
lattice_shape: [Lx, Ly]
sites_per_cell: 2
sublattices: [A, B]
parameters:
  t: {label: "t"}
  U: {label: "U"}
  V: {label: "V"}

# Square-lattice Hubbard + nearest-neighbor density-density V.
# Phase competition: Mott (large U) vs. CDW (large V). Reference: Hirsch
# PRB 31, 4403 (1985); Zhang & Callaway PRB 39, 9397 (1989).
terms:
  - kind: hopping
    from: A
    to: B
    offsets: [[0, 0], [-1, 0], [0, -1]]
    coefficient: "-t"
    hermitian_partner: true

interaction:
  - kind: density_density_onsite
    coefficient: "U"
  - kind: density_density_bond
    from: A
    to: B
    offsets: [[0, 0], [-1, 0], [0, -1]]
    coefficient: "V"

# Hartree shift: U * Σ_i <n↑><n↓> + V * Σ_<ij> <n_i><n_j>.
# For 2D square lattice each site has 4 NN bonds → n_bonds = 2 n_sites.
# <n_i> = n_occ / n_sites (both spins). Total electrons per site n = n_occ/n_sites.
mean_field_correction: "U * n_sites * (n_occ / (2 * n_sites))**2 + 2 * V * n_occ**2 / n_sites"

optimizer:
  type: SPSA
  kwargs:
    maxiter: "@max_iters"

mapper:
  type: JordanWignerMapper
  kwargs: {}

ansatz:
  type: excitation_preserving
  kwargs:
    mode: fsim
    entanglement: linear
    reps: "@n_layers"
  initial_state_prefix: hartree_fock
