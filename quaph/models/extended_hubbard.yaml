name: extended-hubbard
display_name: Extended Hubbard
spin: 2
n_dims: 2
lattice_shape: [Lx, Ly]
sites_per_cell: 2
sublattices: [A, B]
parameters:
  t: {label: "t"}
  U: {label: "U"}
  V: {label: "V"}

# Square-lattice Hubbard + nearest-neighbor density-density V.
# Phase competition: Mott (large U) vs. CDW (large V).
terms:
  - kind: hopping
    from: A
    to: B
    offsets: [[0, 0], [-1, 0], [0, -1]]
    coefficient: "-t"
    hermitian_partner: true

  - kind: density_density
    coefficient: "U"

  - kind: density_density
    from: A
    to: B
    offsets: [[0, 0], [-1, 0], [0, -1]]
    coefficient: "V"

optimizer:
  type: SPSA
  kwargs:
    maxiter: "@max_iters"

mapper:
  type: JordanWignerMapper
  kwargs: {}

ansatz:
  type: excitation_preserving
  kwargs:
    mode: fsim
    entanglement: linear
    reps: "@n_layers"
  initial_state_prefix: hartree_fock
