name: hubbard-triangular
display_name: Hubbard (triangular)
spin: 2
n_dims: 2
lattice_shape: [Lx, Ly]
sites_per_cell: 1
sublattices: [A]
lattice_vectors: [[1.0, 0.0], [0.5, 0.86602540378443864676]]
sublattice_positions:
  A: [0, 0]
parameters:
  t: {label: "t"}
  U: {label: "U"}

# Hubbard on the triangular lattice. Frustration suppresses Néel order; the
# half-filled model has a magnetic / spin-liquid / metal sequence as U/t grows.
terms:
  # 6 NN bonds on the triangular lattice. Use 3 directions and let
  # hermitian_partner produce the back-bonds.
  - kind: hopping
    from: A
    to: A
    offsets: [[1, 0], [0, 1], [1, -1]]
    coefficient: "-t"
    hermitian_partner: true

interaction:
  - kind: density_density_onsite
    coefficient: "U"

mean_field_correction: "U * n_sites * (n_occ / (2 * n_sites))**2"

optimizer:
  type: SPSA
  kwargs:
    maxiter: "@max_iters"

mapper:
  type: JordanWignerMapper
  kwargs: {}

ansatz:
  type: excitation_preserving
  kwargs:
    mode: fsim
    entanglement: linear
    reps: "@n_layers"
  initial_state_prefix: hartree_fock
