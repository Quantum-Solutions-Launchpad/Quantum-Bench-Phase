name: kane-mele-hubbard
display_name: Kane–Mele–Hubbard
spin: 2
n_dims: 2
lattice_shape: [Lx, Ly]
sites_per_cell: 2
sublattices: [A, B]
lattice_vectors: [[-0.86602540378443864676, -1.5], [0.86602540378443864676, -1.5]]
sublattice_positions:
  A: [0,  0]
  B: [0, -1]
parameters:
  t:         {label: "t"}
  lambda_SO: {label: "\\lambda_{SO}"}
  M:         {label: "M"}
  U:         {label: "U"}

# Kane–Mele single-particle skeleton + on-site Hubbard U. Topological-Mott
# physics in (λ_SO, U) at fixed M.
terms:
  - kind: onsite
    sublattice: A
    coefficient: "+M"
  - kind: onsite
    sublattice: B
    coefficient: "-M"

  - kind: hopping
    from: A
    to: B
    offsets: [[0, 0], [-1, 0], [0, -1]]
    coefficient: "-t"
    hermitian_partner: true

  - kind: hopping
    from: A
    to: A
    offsets: [[1, 0], [-1, 1], [0, -1]]
    coefficient: "+1j*lambda_SO"
    hermitian_partner: true
    spin_channels: [up]
  - kind: hopping
    from: A
    to: A
    offsets: [[1, 0], [-1, 1], [0, -1]]
    coefficient: "-1j*lambda_SO"
    hermitian_partner: true
    spin_channels: [down]

  - kind: hopping
    from: B
    to: B
    offsets: [[-1, 0], [1, -1], [0, 1]]
    coefficient: "-1j*lambda_SO"
    hermitian_partner: true
    spin_channels: [up]
  - kind: hopping
    from: B
    to: B
    offsets: [[-1, 0], [1, -1], [0, 1]]
    coefficient: "+1j*lambda_SO"
    hermitian_partner: true
    spin_channels: [down]

  - kind: density_density
    coefficient: "U"

optimizer:
  type: SPSA
  kwargs:
    maxiter: "@max_iters"

mapper:
  type: JordanWignerMapper
  kwargs: {}

ansatz:
  type: excitation_preserving
  kwargs:
    mode: fsim
    entanglement: linear
    reps: "@n_layers"
  initial_state_prefix: hartree_fock
