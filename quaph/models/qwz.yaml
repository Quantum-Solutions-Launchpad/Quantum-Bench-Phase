name: qwz
display_name: Qi–Wu–Zhang
spin: 1
n_dims: 2
lattice_shape: [Lx, Ly]
sites_per_cell: 2
sublattices: [A, B]
parameters:
  t: {label: "t"}
  M: {label: "M"}

# H(k) = t sin(kx) σx + t sin(ky) σy + (M + t cos(kx) + t cos(ky)) σz
# Gap closes at M = -2t (k = 0,0), M = 0 (k = π,0 / 0,π), M = 2t (k = π,π).

terms:
  # M σz
  - kind: onsite
    sublattice: A
    coefficient: "+M"
  - kind: onsite
    sublattice: B
    coefficient: "-M"

  # t cos(kx) σz: A→A and B→B at offset (1,0)
  - kind: hopping
    from: A
    to: A
    offsets: [[1, 0]]
    coefficient: "+t/2"
    hermitian_partner: true
  - kind: hopping
    from: B
    to: B
    offsets: [[1, 0]]
    coefficient: "-t/2"
    hermitian_partner: true
  # t cos(ky) σz: A→A and B→B at offset (0,1)
  - kind: hopping
    from: A
    to: A
    offsets: [[0, 1]]
    coefficient: "+t/2"
    hermitian_partner: true
  - kind: hopping
    from: B
    to: B
    offsets: [[0, 1]]
    coefficient: "-t/2"
    hermitian_partner: true

  # t sin(kx) σx — A↔B chain along x with imaginary half-amplitudes
  - kind: hopping
    from: A
    to: B
    offsets: [[1, 0]]
    coefficient: "-1j*t/2"
    hermitian_partner: true
  - kind: hopping
    from: A
    to: B
    offsets: [[-1, 0]]
    coefficient: "+1j*t/2"
    hermitian_partner: true

  # t sin(ky) σy — A↔B chain along y with real half-amplitudes
  - kind: hopping
    from: A
    to: B
    offsets: [[0, 1]]
    coefficient: "-t/2"
    hermitian_partner: true
  - kind: hopping
    from: A
    to: B
    offsets: [[0, -1]]
    coefficient: "+t/2"
    hermitian_partner: true

optimizer:
  type: SPSA
  kwargs:
    maxiter: "@max_iters"

mapper:
  type: JordanWignerMapper
  kwargs: {}

ansatz:
  type: excitation_preserving
  kwargs:
    mode: fsim
    entanglement: linear
    reps: "@n_layers"
  initial_state_prefix: hartree_fock
