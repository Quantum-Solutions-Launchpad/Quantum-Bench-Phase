name: t-V
display_name: t-V (spinless)
spin: 1
n_dims: 1
lattice_shape: [Lx]
sites_per_cell: 1
sublattices: [A]
parameters:
  t: {label: "t"}
  V: {label: "V"}

# 1D spinless fermions with NN hopping t and NN density-density V.
# At half filling: Luttinger liquid for |V|<2t, CDW for V>2t.
# Reference: Yang & Yang J. Math. Phys. 8, 327 (1967); Haldane PRL 47, 1840 (1981).
terms:
  - kind: hopping
    from: A
    to: A
    offsets: [[1]]
    coefficient: "-t"
    hermitian_partner: true

interaction:
  - kind: density_density_bond
    from: A
    to: A
    offsets: [[1]]
    coefficient: "V"

# Hartree shift V * n_bonds * <n>^2 with n_bonds = n_sites and <n> = n_occ/n_sites.
mean_field_correction: "V * n_occ**2 / n_sites"

optimizer:
  type: SPSA
  kwargs:
    maxiter: "@max_iters"

mapper:
  type: JordanWignerMapper
  kwargs: {}

ansatz:
  type: excitation_preserving
  kwargs:
    mode: fsim
    entanglement: linear
    reps: "@n_layers"
  initial_state_prefix: hartree_fock
